[package]
name = "neux"
version = "0.1.0"
edition = "2021"
description = "LSFS - Semantic file search for developers"
authors = ["Hamouda ALIAS"]
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
sentence-transformers = "0.2"
faiss = "0.8"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.10"
walkdir = "2"

[build-dependencies]