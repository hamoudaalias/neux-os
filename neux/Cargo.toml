[package]
name = "neux"
version = "0.1.0"
edition = "2021"
description = "LSFS - Semantic file search for developers"
authors = ["Hamouda ALIAS"]
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]